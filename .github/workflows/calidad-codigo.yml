# ============================================================================
# Pipeline de calidad de código - backend ep03 (Gradle / Spring Boot)
#
# Port del pipeline Maven de referencia (calidad-codigo.yml + pom.xml) a Gradle.
#
# UBICACIÓN (crítico): GitHub Actions SOLO ejecuta los workflows que están en
# `.github/workflows/` en la RAIZ del repositorio. Este archivo debe quedar así:
#
#     <repo>/
#     |-- .github/workflows/calidad-codigo.yml   <-- este archivo
#     |-- build.gradle
#     |-- gradlew
#     `-- src/
#
# Equivalencias Maven -> Gradle:
#   spotless:check          <-> ./gradlew spotlessCheck
#   checkstyle:check        <-> ./gradlew checkstyleMain checkstyleTest
#   pmd:check               <-> ./gradlew pmdMain pmdTest
#   spotbugs:check          <-> ./gradlew spotbugsMain spotbugsTest
#   test                    <-> ./gradlew test
#   pitest:mutationCoverage <-> ./gradlew pitest
#   jacoco:check            <-> ./gradlew test jacocoTestReport jacocoTestCoverageVerification
#   sonar:sonar             <-> ./gradlew sonar
#   gatling:test            <-> ./gradlew gatlingRun
#   jmeter (perfil)         <-> ./gradlew jmeterTest
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   SONAR_TOKEN, SNYK_TOKEN
# ============================================================================

name: Calidad de código

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. SPOTLESS - formato de código
  # ============================================================
  spotless:
    name: Spotless (formato de código)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Verificar formato con Spotless
        run: ./gradlew --no-daemon spotlessCheck

  # ============================================================
  # 2. CHECKSTYLE - convenciones de código
  # ============================================================
  checkstyle:
    name: Checkstyle (convenciones de código)
    needs: spotless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Verificar convenciones con Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest

      - name: Subir reporte de Checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 3. PMD - code smells
  # ============================================================
  pmd:
    name: PMD (code smells)
    needs: checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Analizar code smells con PMD
        run: ./gradlew --no-daemon pmdMain pmdTest

      - name: Subir reporte de PMD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: build/reports/pmd/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 4. SPOTBUGS - bugs en el bytecode
  # ============================================================
  spotbugs:
    name: SpotBugs (bugs en el bytecode)
    needs: pmd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Analizar bugs con SpotBugs
        run: ./gradlew --no-daemon spotbugsMain spotbugsTest

      - name: Subir reporte de SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 5. TEST - pruebas unitarias (JUnit + Mockito)
  # ============================================================
  test:
    name: Pruebas unitarias (JUnit + Mockito)
    needs: spotbugs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias y de contrato
        run: ./gradlew --no-daemon test contractTest

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            build/test-results/test/
            build/test-results/contractTest/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 6. MUTATION - pruebas de mutación (PIT)
  # ============================================================
  mutation:
    name: Mutación (PIT)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Ejecutar pruebas de mutación con PIT
        run: ./gradlew --no-daemon pitest

      - name: Subir reporte de PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: build/reports/pitest/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 7. JACOCO - cobertura de pruebas
  # ============================================================
  jacoco:
    name: JaCoCo (cobertura de pruebas)
    needs: mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Verificar cobertura con JaCoCo
        run: ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification

      - name: Subir reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/html/
            build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 8. SONARQUBE - calidad
  # ============================================================
  sonarqube:
    name: SonarQube (calidad)
    needs: jacoco
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Análisis con SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN no configurado; se omite el análisis de SonarQube."
            exit 0
          fi
          ./gradlew --no-daemon test jacocoTestReport sonar

  # ============================================================
  # 9. SNYK - seguridad de dependencias
  # ============================================================
  snyk:
    name: Snyk (seguridad de dependencias)
    needs: sonarqube
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Snyk CLI
        run: npm install -g snyk@latest

      - name: Analizar dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN no configurado; se omite el análisis de Snyk."
            exit 0
          fi
          snyk test --file=build.gradle --severity-threshold=critical

  # ============================================================
  # 10. CUCUMBER - BDD / integración
  # ============================================================
  cucumber:
    name: Cucumber (BDD / integración)
    needs: snyk
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Ejecutar pruebas BDD con Cucumber
        run: ./gradlew --no-daemon test --tests "cl.duocuc.ep03.cucumber.CucumberRunnerTest"

  # ============================================================
  # 11. CONTAINER - Docker + Trivy
  # ============================================================
  container:
    name: Contenedor (Docker + Trivy)
    needs: cucumber
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t ep03-backend:${{ github.sha }} .

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ep03-backend:${{ github.sha }}
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ============================================================
  # 12. DAST - OWASP ZAP
  # ============================================================
  dast:
    name: DAST (OWASP ZAP)
    needs: container
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ep03
          POSTGRES_USER: ep03_user
          POSTGRES_PASSWORD: ep03_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ep03_user -d ep03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ep03
      SPRING_DATASOURCE_USERNAME: ep03_user
      SPRING_DATASOURCE_PASSWORD: ep03_pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Levantar la aplicación
        run: |
          nohup ./gradlew bootRun -Dnet.bytebuddy.experimental=true > app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then echo "Aplicación lista"; exit 0; fi
            sleep 2
          done
          echo "La aplicación no respondió a tiempo" >&2
          cat app.log
          exit 1

      - name: Escanear con ZAP (baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          cmd_options: '-i'
          fail_action: 'true'
          allow_issue_writing: 'false'

      - name: Subir log de la aplicación (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dast-app-log
          path: app.log
          if-no-files-found: ignore

      - name: Detener la aplicación
        if: always()
        run: |
          pkill -f 'bootRun' || true
          pkill -f 'cl.duocuc.ep03' || true

  # ============================================================
  # 13. PERFORMANCE - Gatling
  # ============================================================
  performance:
    name: Rendimiento (Gatling)
    needs: dast
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ep03
          POSTGRES_USER: ep03_user
          POSTGRES_PASSWORD: ep03_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ep03_user -d ep03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ep03
      SPRING_DATASOURCE_USERNAME: ep03_user
      SPRING_DATASOURCE_PASSWORD: ep03_pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Levantar la aplicación
        run: |
          nohup ./gradlew bootRun -Dnet.bytebuddy.experimental=true > app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then echo "Aplicación lista"; exit 0; fi
            sleep 2
          done
          echo "La aplicación no respondió a tiempo" >&2
          cat app.log
          exit 1

      - name: Ejecutar Gatling
        run: ./gradlew --no-daemon gatlingRun -Dnet.bytebuddy.experimental=true

      - name: Subir reporte de Gatling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: build/reports/gatling/
          if-no-files-found: ignore
          retention-days: 7

      - name: Subir log de la aplicación (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-app-log
          path: app.log
          if-no-files-found: ignore

      - name: Detener la aplicación
        if: always()
        run: |
          pkill -f 'bootRun' || true
          pkill -f 'cl.duocuc.ep03' || true

  # ============================================================
  # 14. PERFORMANCE-JMETER - JMeter
  # ============================================================
  performance-jmeter:
    name: Rendimiento (JMeter)
    needs: performance
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ep03
          POSTGRES_USER: ep03_user
          POSTGRES_PASSWORD: ep03_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ep03_user -d ep03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ep03
      SPRING_DATASOURCE_USERNAME: ep03_user
      SPRING_DATASOURCE_PASSWORD: ep03_pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Levantar la aplicación
        run: |
          nohup ./gradlew bootRun -Dnet.bytebuddy.experimental=true > app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then echo "Aplicación lista"; exit 0; fi
            sleep 2
          done
          echo "La aplicación no respondió a tiempo" >&2
          cat app.log
          exit 1

      - name: Ejecutar JMeter
        run: ./gradlew --no-daemon jmeterTest

      - name: Subir resultados de JMeter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: build/jmeter/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Subir log de la aplicación (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-app-log
          path: app.log
          if-no-files-found: ignore

      - name: Detener la aplicación
        if: always()
        run: |
          pkill -f 'bootRun' || true
          pkill -f 'cl.duocuc.ep03' || true

  # ============================================================
  # 15. METRICAS CI/CD - publicacion a AWS CloudWatch (IE12)
  # ============================================================
  # Extrae las metricas clave de desempeno y calidad del pipeline y las
  # publica en el namespace Ep03/CI para alimentar el dashboard
  # "ep03-observabilidad" (bloque06-observabilidad/crear-dashboard.sh):
  #   - BuildDurationSeconds : tiempo total de build (inicio del run -> ahora)
  #   - TestCoveragePercent  : cobertura de lineas JaCoCo
  #   - TestsFailed          : sumatoria failures+errors de los XML JUnit
  # Corre con if: always() para que un run con fallas tambien publique
  # TestsFailed (deteccion de eventos criticos del propio pipeline).
  # ============================================================
  metricas-ci:
    name: Métricas CI/CD -> CloudWatch (Ep03/CI)
    needs:
      [
        spotless,
        checkstyle,
        pmd,
        spotbugs,
        test,
        mutation,
        jacoco,
        sonarqube,
        snyk,
        cucumber,
        container,
        dast,
        performance,
        performance-jmeter,
      ]
    if: always()
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Ejecutar tests y reporte de cobertura para extraer métricas
        run: ./gradlew --no-daemon test contractTest jacocoTestReport

      - name: Calcular métricas del pipeline
        id: metricas
        run: |
          set -euo pipefail

          # 1) Tiempo de build: inicio del run (API de GitHub) -> ahora
          STARTED_AT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          BUILD_SECONDS=$(( $(date -u +%s) - $(date -u -d "$STARTED_AT" +%s) ))
          echo "build_seconds=${BUILD_SECONDS}" >> "$GITHUB_OUTPUT"
          echo "Duración del run: ${BUILD_SECONDS}s (inició ${STARTED_AT})"

          # 2) Cobertura de líneas JaCoCo (contador raíz = último del XML)
          JACOCO="build/reports/jacoco/test/jacocoTestReport.xml"
          if [ -f "$JACOCO" ]; then
            LINE_COUNTER=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"' "$JACOCO" | tail -1)
            MISSED=$(echo "$LINE_COUNTER"   | sed -E 's/.*missed="([0-9]+)".*/\1/')
            COVERED=$(echo "$LINE_COUNTER"  | sed -E 's/.*covered="([0-9]+)".*/\1/')
            TOTAL=$(( ${MISSED:-0} + ${COVERED:-0} ))
            [ "$TOTAL" -gt 0 ] || TOTAL=1
            COVERAGE=$(awk "BEGIN{printf \"%.1f\", ${COVERED:-0}*100/$TOTAL}")
          else
            echo "::warning::No se encontró $JACOCO"; COVERAGE=0
          fi
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"

          # 3) Tests fallidos (failures + errors en todos los XML de JUnit)
          TESTS_FAILED=0
          for f in build/test-results/test/*.xml build/test-results/contractTest/*.xml; do
            [ -f "$f" ] || continue
            FAILURES=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            ERRORS=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            TESTS_FAILED=$(( TESTS_FAILED + ${FAILURES:-0} + ${ERRORS:-0} ))
          done
          echo "tests_failed=${TESTS_FAILED}" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciales AWS
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Publicar métricas en CloudWatch (namespace Ep03/CI)
        if: always()
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::warning::Sin AWS_ACCESS_KEY_ID en secrets; métricas CI/CD no publicadas."
            exit 0
          fi
          # Nota: put-metric-data NO acepta --dimensions junto con --metric-data;
          # las dimensiones van dentro de cada entrada MetricData.
          DIMS="Dimensions=[{Name=Repository,Value=${{ github.repository }}},{Name=Branch,Value=${{ github.ref_name }}}]"
          aws cloudwatch put-metric-data \
            --namespace Ep03/CI \
            --region "$AWS_REGION" \
            --metric-data \
              "MetricName=BuildDurationSeconds,Value=${{ steps.metricas.outputs.build_seconds }},Unit=Seconds,${DIMS}" \
              "MetricName=TestCoveragePercent,Value=${{ steps.metricas.outputs.coverage }},Unit=Percent,${DIMS}" \
              "MetricName=TestsFailed,Value=${{ steps.metricas.outputs.tests_failed }},Unit=Count,${DIMS}"
          echo "Métricas publicadas: build=${{ steps.metricas.outputs.build_seconds }}s, cobertura=${{ steps.metricas.outputs.coverage }}%, tests fallidos=${{ steps.metricas.outputs.tests_failed }}"
