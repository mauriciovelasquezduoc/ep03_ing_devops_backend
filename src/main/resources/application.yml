server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

spring:
  # Datasource por defecto: H2 en memoria (usado en tests sin perfil activo)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  h2:
    console:
      enabled: false

# ==================================================================
# Spring Boot Actuator — Health endpoints para Kubernetes probes
# ==================================================================
management:
  endpoints:
    web:
      exposure:
        # prometheus: metricas del microservicio para scraping / dashboards
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  observations:
    key-values:
      # Etiqueta que acompana todas las metricas del microservicio
      application: ep03-backend
  cloudwatch:
    metrics:
      export:
        # El push a CloudWatch solo se activa en el perfil "prod"
        # (application-prod.yml); en tests/CI no hay credenciales AWS.
        enabled: false
