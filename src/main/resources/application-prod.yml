spring:
  config:
    activate:
      on-profile: prod

  # ── PostgreSQL producción (AWS RDS / EC2 separado) ────────────────────────
  # Las variables de entorno se inyectan en el contenedor o en ECS task definition
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/ep03}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:ep03_user}
    password: ${DB_PASSWORD:ep03_pass}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# ==================================================================
# Observabilidad — metricas del microservicio hacia AWS CloudWatch
# (IE12). El push lo hace Micrometer (micrometer-registry-cloudwatch2);
# las credenciales las resuelve la cadena por defecto de AWS SDK
# (identidad del rol del nodo EKS via IMDS, sin claves en el pod).
# Requiere que el rol del nodo tenga cloudwatch:PutMetricData.
# ==================================================================
management:
  cloudwatch:
    metrics:
      export:
        enabled: true
        namespace: Ep03/App
        step: 1m
        # maxValuesPerRequest: 20  # (default) lote por llamada a PutMetricData
